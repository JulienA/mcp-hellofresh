# One HTTP process, many HelloFresh accounts.
# PUBLIC_BASE_URL is the HTTPS origin clients call, with no path.
#
#   PUBLIC_BASE_URL=https://hf-mcp.example.com docker compose up -d --build
#
# Or put that line in a .env file next to this file. Compose reads it for
# interpolation and refuses to start when the variable is missing.

services:
  mcp-hellofresh:
    build: .
    image: mcp-hellofresh
    ports:
      - "8080:8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin, with no path}
    volumes:
      - hellofresh-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hellofresh-data:
